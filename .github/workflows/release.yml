name: Release

# Publishing is driven by a version tag (`git tag v0.1.0 && git push --tags`).
# The npm token lives in the repository secret NPM_TOKEN; provenance is
# published from GitHub Actions (this repo is public), so consumers can verify
# the artefact was built from this source.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
